; ESP32-S3 N16R8 + pantalla SPI 2.8" ILI9341 240x320 (modulo rojo v1.2)
; con tactil resistivo XPT2046 y lector SD del mismo modulo.
; Basado en boards/renphone-accretion (probado en hardware real).
;
; CABLEADO (ESP32-S3 DevKitC-1 N16R8)
;   Pantalla:  VCC->3V3  GND->GND  CS->10  RESET->14  DC->2
;              SDI(MOSI)->11  SCK->12  LED->21  SDO(MISO)->NO CONECTAR
;   Tactil:    T_CLK->6  T_CS->9  T_DIN->5  T_DO->4  T_IRQ->no conectar
;   SD:        SD_CS->8  SD_MOSI->11  SD_MISO->13  SD_SCK->12
;   (GPIO 26-37 prohibidos: los usan flash y PSRAM octal)

[diy_s3_common]
board = esp32s3
board_build.partitions = support_files/custom_16Mb.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_src_filter = ${env.build_src_filter} +<../boards/diy-esp32s3-ili9341>
build_flags =
	${env.build_flags}
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1

	-DDEVICE_NAME='"ESP32-S3 ILI9341 2.8"'
	-DOTA_TAG='"esp32s3_ili9341"'
	-DDISABLE_OTA=1

	; igual que la CYD-2432S028 oficial (se puede rotar en Settings)
	-DROTATION=0

	; ---- Pantalla ILI9341 por SPI hardware ----
	-D TFT_DATABUS_N=0         # Arduino_HWSPI
	-D TFT_DISPLAY_DRIVER_N=4  # 4 = ILI9341 (si tu panel resulta ser ST7789, pon 1)
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DTFT_SCLK=12
	-DTFT_MOSI=11
	-DTFT_MISO=13
	-DTFT_CS=10
	-DTFT_DC=2
	-DTFT_RST=14
	-DTFT_BL=21
	-DTOUCH_CS=-1
	-D TFT_IPS=0               # si ves colores invertidos, pon 1
	-D TFT_COL_OFS1=0
	-D TFT_ROW_OFS1=0
	-D TFT_COL_OFS2=0
	-D TFT_ROW_OFS2=0

	; ---- SD en el mismo bus SPI de la pantalla, CS propio ----
	-DSDCARD_CS=8
	-DSDCARD_SCK=12
	-DSDCARD_MISO=13
	-DSDCARD_MOSI=11

lib_ignore =
	SensorLib
	XPowersLib



[env:diy-esp32s3-ili9341]
extends = diy_s3_common
build_flags =
	${diy_s3_common.build_flags}
	; ---- Tactil XPT2046 en pines propios (bit-bang) ----
	-DHAS_TOUCH=1
	-DHAS_RESISTIVE_TOUCH=1
	-DTOUCH_CTRL_XPT2046=1
	-DCYD28_TouchR_IRQ=-1
	-DCYD28_TouchR_MISO=4
	-DCYD28_TouchR_MOSI=5
	-DCYD28_TouchR_CLK=6
	-DCYD28_TouchR_CS=9


; Variante SIN tactil: 3 botones a GND
;   Anterior->15  Siguiente->16  Seleccionar->17   (Anterior+Siguiente = Atras)
[env:diy-esp32s3-ili9341-btn]
extends = diy_s3_common
build_flags =
	${diy_s3_common.build_flags}
	-DHAS_3_BUTTON=1
	-DBTN_PREV=15
	-DBTN_NEXT=16
	-DBTN_SEL=17
